<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding club</title>
</head>
<body>
    <nav><a href="event">Events</a>| <a href="Register">Register</a></nav>
    <h1>Cooding Club</h1>
    <h2 id="events">Upcoming Events</h2>
    <table border="1">
        <caption>Club Event</caption>
        <thead>
            <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Venue</th>
            </tr>
            <tr>
                <td>Hackathon</td>
                <td>20 nov</td>
                <td>Semiar Hall</td>
            </tr>
            <tr>
                <td colspan="3">total event:2</td>
            </tr>
        </thead>
    </table>
    <h2>Register</h2>
    <form action="#" method="post">
        <label for="Name">Name:</label>
        <input for="text" id="Name" name="Name" placeholder="your name" required>
        <br>
        <br>
        <label for="email">Email:</label>
        <input for="email" id="email" name="email"required>
        <br>
        <br>
        <label for="password">Password:</label>
        <input for="password" id="password" name="paasword" required>
        <br>
        <br>
        <label for="dob">Date of birth:</label>
        <input form="date" id="dob" name="dob"required>
        <br>
        <br>
        <label for="phone">Phone:</label>
        <input for="tel" id="phone" name="phone"required>
        <br>        
        <p>Gender:
            <input type="radio" name="gender" id="m"><label for="m">Male</label>
            <input type="radio" name="gender" id="f"><label for="f">Female</label>
        <p>Interests:
            <input type="checkbox" id="web"><label for="web">Web</label>
            <input type="checkbox" id="dsa"><label for="dsa">DSA</label>
        </p>
        <p><label for="branch">Branch:</label>
            <select id="branch" name="branch">
                <option>BCA</option>
                <option>B.Tech</option>
            </select>
        </p>
        <p><label for="msg">Why do you want to join?</label><br>
            <textarea id="msg" rows="3" cols="30"></textarea>
        </p>
        <button type="submit">Register</button>
    </form>
</body>
</html>
